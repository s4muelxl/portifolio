name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check portfolio.js
          node --check receipt-core.mjs
          node --check receipt-demo.mjs
      - name: Receipt and project regression tests
        run: node --test tests/*.test.mjs
      - name: Generated components
        run: node scripts/sync-projects.mjs --check
      - name: Content, links and resource budget
        run: python3 scripts/check-site.py
